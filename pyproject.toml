[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docsort"
version = "0.1.0"
description = "Automatische Klassifizierung und Sortierung eingescannter Dokumente per OCR und lokalem LLM"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
keywords = ["ocr", "document-sorting", "llm", "docling", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
# Pinned dependencies — tested and working as of 2026-04-03
dependencies = [
    "docling>=2.84,<3",
    "pymupdf>=1.25,<2",
    "openai>=2.30,<3",
    "gradio>=6.11,<7",
    "click>=8.3,<9",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
gpu = ["torch>=2.11,<3", "torchvision>=0.26,<1", "torchaudio>=2.11,<3"]
ocr-onnxtr = ["docling-ocr-onnxtr[gpu]"]
anthropic = ["anthropic>=0.30,<1"]
all-llm = ["anthropic>=0.30,<1"]
dev = ["pytest>=9.0,<10", "pytest-cov>=7.1,<8"]

[project.scripts]
docsort = "docsort.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
