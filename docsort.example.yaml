# DocSort Konfiguration
# Kopiere diese Datei nach docsort.yaml und passe sie an.
# CLI: docsort init (erstellt eine neue docsort.yaml)

# Aktives LLM-Profil (lm-studio, ollama, openai, anthropic, gemini)
active_profile: lm-studio

# Eigene oder angepasste Profile
# Eingebaute Profile müssen nur angegeben werden wenn sie geändert werden sollen.
profiles:
  # Beispiel: OpenAI mit eigenem API-Key
  # openai:
  #   provider: openai
  #   base_url: https://api.openai.com/v1
  #   model: gpt-4o-mini
  #   api_key: sk-dein-api-key-hier
  #   description: OpenAI API

  # Beispiel: Anthropic Claude
  # anthropic:
  #   provider: anthropic
  #   base_url: https://api.anthropic.com
  #   model: claude-sonnet-4-20250514
  #   api_key: sk-ant-dein-api-key-hier
  #   description: Anthropic Claude API

  # Beispiel: Eigenes Profil
  # mein-server:
  #   provider: openai
  #   base_url: http://192.168.1.100:8080/v1
  #   model: mein-modell
  #   api_key: optional
  #   description: Mein eigener LLM-Server

# Ausgabeverzeichnis
output_dir: ./sorted

# Modus: copy oder move
mode: copy

# GPU-Beschleunigung (nur für OCR gescannter Dokumente)
gpu: true
ocr_batch_size: 32

# Seitenlimit — nur die ersten N Seiten extrahieren (0 = alle)
# Für Klassifizierung reichen die ersten Seiten (Briefkopf, Absender, Datum).
# Spart bei langen Dokumenten erheblich OCR-Zeit.
max_pages: 5

# Parallele Verarbeitung — Anzahl gleichzeitiger LLM-Anfragen
# LLM-Aufrufe (2-5s pro Datei) werden parallel ausgeführt,
# die Datei-Organisation bleibt sequentiell (keine Race-Conditions).
# 1 = sequentiell (wie bisher), Standard: 4
max_workers: 4

# Extraktions-Cache — speichert extrahierten Text auf Disk (SHA-256 als Key).
# Vermeidet wiederholtes OCR bei erneutem Durchlauf derselben Dateien.
# Leerstring oder auskommentieren = Cache deaktiviert.
# CLI: --no-cache deaktiviert den Cache einmalig.
cache_dir: .docsort_cache

# Ordnerstruktur-Template
# Variablen: {doc_type}, {absender}, {year}, {month}, {filename}
# Standard: {doc_type}/{year}/{absender}/{filename}
# Beispiele:
#   {doc_type}/{year}/{filename}                    → Rechnung/2026/...
#   {year}/{doc_type}/{absender}/{filename}          → 2026/Rechnung/Stadtwerke/...
#   {doc_type}/{year}/{month}/{absender}/{filename}  → Rechnung/2026/03/Stadtwerke/...
#   {filename}                                       → Flache Struktur
folder_template: "{doc_type}/{year}/{absender}/{filename}"

# Dateinamen-Template — bestimmt den generierten Dateinamen (ohne Extension)
# Variablen: {doc_date}, {short_info}, {absender}, {doc_type}, {year}, {month}
# Standard: {doc_date}_{short_info}  → 2026-01-15_Strom-Abrechnung.pdf
# Beispiele:
#   {doc_date}_{absender}_{short_info}  → 2026-01-15_Stadtwerke_Strom-Abrechnung.pdf
#   {doc_date}_{doc_type}_{short_info}  → 2026-01-15_Rechnung_Strom-Abrechnung.pdf
# filename_template: "{doc_date}_{short_info}"

# Dokumenttypen (entkommentieren um anzupassen)
# doc_types:
#   - Rechnung
#   - Quittung
#   - Vertrag
#   - Kuendigung
#   - Brief
#   - Bescheid
#   - Steuerbescheid
#   - Kontoauszug
#   - Lohnabrechnung
#   - Versicherung
#   - Mahnung
#   - Angebot
#   - Lieferschein
#   - Gutschrift
#   - Mietvertrag
#   - Arbeitsvertrag
#   - Zeugnis
#   - Urkunde
#   - Formular
#   - Sonstiges

# Confidence-Schwelle (0.0 - 1.0)
# Unter diesem Wert wird eine Warnung angezeigt
confidence_threshold: 0.7

# Max. Retries bei LLM-Fehler
max_retries: 2

# Logging in Datei (leer = nur Konsole)
# log_file: ./docsort.log

# Undo-Log für Rückgängig-Funktion (leer = deaktiviert)
# undo_log: ./docsort_undo.csv

# System-Prompt (entkommentieren und anpassen)
# Der Platzhalter {doc_types} wird durch die Dokumenttypen-Liste ersetzt.
# system_prompt: |
#   Du bist ein Dokumenten-Klassifizierer. ...
